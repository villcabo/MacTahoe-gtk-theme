# dconf load /org/gnome/shell/extensions/appindicator/ < appindicator.ini
# custom-icons, icon-brightness and icon-saturation are managed by tahoe-menubar.
#
# compact-mode-enabled=false: Ubuntu enables it by default, and it sets an
# inline "-natural-hpadding: 10px" on every tray button that no theme rule can
# override. With it off, the theme's 30px tray buttons apply, which keeps the
# clock on screen (GNOME caps each side of the bar at half its width).
[/]
compact-mode-enabled=false
legacy-tray-enabled=true
