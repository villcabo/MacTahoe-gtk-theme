# dconf load /org/gnome/shell/extensions/blur-my-shell/ < blur-my-shell.ini
[/]
hacks-level=1
pipelines={'pipeline_default': {'name': <'Default'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_51618268171506'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_50050490769246': {'name': <'Rounded'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_51618268171506'>, 'params': <{'unscaled_radius': <30>, 'brightness': <0.90000000000000002>}>}>]>}, 'pipeline_migrated_dynamic_blur': {'name': <'Migrated dynamic blur'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_migrated_dynamic_blur'>, 'params': <{'unscaled_radius': <60>, 'brightness': <0.59999999999999998>}>}>]>}, 'pipeline_migrated_dynamic_blur_2': {'name': <'Migrated dynamic blur 2'>, 'effects': <[<{'type': <'dual_kawase_blur'>, 'id': <'effect_migrated_dynamic_blur'>, 'params': <{'unscaled_radius': <20>, 'brightness': <0.84999999999999998>}>}>]>}}
rounded-blur-found=false
settings-version=7

[appfolder]
pipeline='pipeline_migrated_dynamic_blur'

[applications]
blur=true
blur-on-overview=true
corner-radius=26
dynamic-opacity=false
enable-all=false
opacity=248
pipeline='pipeline_50050490769246'
static-blur=true
whitelist=['vicinae']

[coverflow-alt-tab]
pipeline='pipeline_default'

[dash-to-dock]
blur=true
override-background=false
pipeline='pipeline_50050490769246'
static-blur=true
style-dash-to-dock=0
unblur-in-overview=false

[dash-to-panel]
blur-original-panel=true

[hidetopbar]
compatibility=false

[lockscreen]
blur=false
pipeline='pipeline_default'

[overview]
blur=true
pipeline='pipeline_default'

[panel]
blur=true
force-light-text=false
override-background=false
override-background-dynamically=false
pipeline='pipeline_migrated_dynamic_blur_2'
static-blur=false
style-panel=1
unblur-in-overview=false

[popup]
blur=true
dialog-corner-radius=40
menu-corner-radius=14
notification-corner-radius=14
osd-corner-radius=24
pipeline='pipeline_default'
preserve-shell-theme=true
quick-settings-corner-radius=33
static-blur=true

[screenshot]
pipeline='pipeline_default'

[window-list]
pipeline='pipeline_migrated_dynamic_blur'
