# dconf load /org/gnome/shell/extensions/rounded-window-corners-reborn/ < rounded-window-corners.ini
[/]
blacklist=['jetbrains-idea', 'jetbrains-datagrip', 'jetbrains-goland', 'jetbrains-pycharm', 'jetbrains-webstorm', 'jetbrains-studio']
border-width=1
global-rounded-corner-settings={'padding': <{'left': <uint32 1>, 'right': <uint32 1>, 'top': <uint32 1>, 'bottom': <uint32 1>}>, 'keepRoundedCorners': <{'maximized': <true>, 'fullscreen': <false>}>, 'borderRadius': <uint32 26>, 'smoothing': <0>, 'borderColor': <[1.0, 1.0, 1.0, 0.25]>, 'enabled': <true>}
keep-shadow-for-maximized-fullscreen=true
settings-version=uint32 9
tweak-kitty-terminal=true
